<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick checkout — Healer Lab</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-mark">H</span> Healer Lab</a>
    <span class="topbar-note">QUICK CHECKOUT</span>
  </header>

  <main class="page-shell">
    <a class="back-link" href="../index.html">← ALL SCENARIOS</a>

    <section class="demo-panel" aria-labelledby="checkout-title">
      <h1 id="checkout-title">Quick checkout</h1>
      <p>Set the quantity for your item, then continue to checkout.</p>

      <article class="demo-card" aria-label="Everyday Bottle product">
        <div class="product-row">
          <div class="product-art" aria-hidden="true">◉</div>
          <div>
            <h2>Everyday Bottle</h2>
            <p>Insulated steel · 500 ml</p>
          </div>
          <span class="product-price">$24.00 each</span>
        </div>

        <div class="action-row quantity-control" aria-label="Product quantity controls">
          <button class="button secondary" id="decrease-quantity" type="button" aria-label="Decrease quantity">−</button>
          <span id="quantity-value" class="quantity-value" aria-live="polite">1</span>
          <button class="button secondary" id="increase-quantity" type="button" aria-label="Increase quantity">+</button>
        </div>

        <p class="muted">Item count: <strong id="item-count" aria-live="polite">1</strong></p>
        <p class="muted">Order total: <strong id="order-total">$24.00</strong></p>

        <div class="action-row">
          <button class="button" id="checkout-button" type="button">Checkout</button>
        </div>
        <p id="checkout-status" class="result-line" role="status" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <script>
    const quantityValue = document.getElementById('quantity-value');
    const itemCount = document.getElementById('item-count');
    const orderTotal = document.getElementById('order-total');
    const checkoutStatus = document.getElementById('checkout-status');
    const unitPrice = 24;

    function updateOrder(quantity) {
      const safeQuantity = Math.max(1, quantity);
      quantityValue.textContent = String(safeQuantity);
      itemCount.textContent = String(safeQuantity);
      orderTotal.textContent = `$${(unitPrice * safeQuantity).toFixed(2)}`;
      checkoutStatus.textContent = '';
    }

    document.getElementById('increase-quantity').addEventListener('click', () => {
      updateOrder(Number(quantityValue.textContent) + 1);
    });

    document.getElementById('decrease-quantity').addEventListener('click', () => {
      updateOrder(Number(quantityValue.textContent) - 1);
    });

    document.getElementById('checkout-button').addEventListener('click', () => {
      const count = Number(quantityValue.textContent);
      checkoutStatus.textContent = `Checkout started for ${count} ${count === 1 ? 'item' : 'items'}.`;
    });
  </script>
</body>
</html>
